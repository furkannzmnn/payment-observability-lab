spring:
  application:
    name: payment-obs-lab

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: payment-obs-lab
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    dev.furkan.paymentobs: INFO
